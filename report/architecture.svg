<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
<rect width="1400" height="860" fill="#0D1117"/>
<rect width="1400" height="860" fill="url(#dots)"/>
<defs>
  <pattern id="dots" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1" fill="#1C2128" opacity="0.8"/>
