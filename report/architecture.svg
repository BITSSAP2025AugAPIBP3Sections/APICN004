<text x="700" y="38" font-size="22" font-weight="700" fill="#E6EDF3" text-anchor="middle" letter-spacing="0.4">APICN004  ·  Indian Income Tax RAG VoiceBot</text>
<text x="700" y="60" font-size="11" fill="#8B949E" text-anchor="middle">Four interaction modes — one shared RAG pipeline — grounded, cited, streaming answers</text>

